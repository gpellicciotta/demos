<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Speech API — Voice-to-Text Demo</title>
  <!-- Load Tailwind CSS for clean, modern, responsive styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load Inter font for high legibility -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Subtle ripple pulse animation when the microphone is actively listening */
    @keyframes mic-ripple {
      0% {
        transform: scale(1);
        opacity: 0.65;
      }
      100% {
        transform: scale(1.55);
        opacity: 0;
      }
    }

    .animate-mic-ripple {
      animation: mic-ripple 1.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    /* Equalizer bar animation for live feedback */
    @keyframes eq-bar {
      0%, 100% {
        transform: scaleY(0.35);
      }
      50% {
        transform: scaleY(1);
      }
    }

    .eq-bar-1 {
      animation: eq-bar 0.7s ease-in-out infinite;
    }
    .eq-bar-2 {
      animation: eq-bar 0.55s ease-in-out 0.15s infinite;
    }
    .eq-bar-3 {
      animation: eq-bar 0.65s ease-in-out 0.3s infinite;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 flex flex-col items-center justify-center p-4 sm:p-6">

  <!-- Main Card Container -->
  <main class="w-full max-w-2xl bg-white rounded-3xl shadow-xl shadow-slate-200/70 border border-slate-200/80 overflow-hidden">
    
    <!-- Header Bar -->
    <header class="px-6 py-5 sm:px-8 sm:py-6 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center justify-center w-2.5 h-2.5 rounded-full bg-indigo-600"></span>
          <span class="text-xs font-semibold uppercase tracking-wider text-indigo-600">Browser Native API</span>
        </div>
        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 mt-1">Voice-to-Text Transcriber</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-0.5">
          100% client-side using <code class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-700 font-mono text-xs">SpeechRecognition</code>
        </p>
      </div>

      <!-- Language Selector -->
      <div class="flex flex-col sm:items-end">
        <label for="language-select" class="text-xs font-medium text-slate-500 mb-1">
          Spoken Language
        </label>
        <div class="relative w-full sm:w-52">
          <select
            id="language-select"
            aria-label="Spoken language"
            class="w-full appearance-none rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 pr-9 text-sm font-medium text-slate-700 shadow-sm transition focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 cursor-pointer"
          >
            <option value="">Browser Default (Auto)</option>
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="nl-BE">Dutch (Belgium)</option>
            <option value="nl-NL">Dutch (Netherlands)</option>
            <option value="fr-FR">French (France)</option>
            <option value="de-DE">German (Germany)</option>
            <option value="it-IT">Italian (Italy)</option>
            <option value="es-ES">Spanish (Spain)</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </div>
        </div>
      </div>
    </header>

    <!-- Browser Compatibility / Error Alert Banner (Hidden by default) -->
    <div
      id="alert-banner"
      role="alert"
      class="hidden mx-6 sm:mx-8 mt-5 rounded-2xl border px-4 py-3.5 text-sm flex items-start gap-3"
    >
      <svg id="alert-icon" class="w-5 h-5 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <div class="flex-1">
        <p id="alert-title" class="font-semibold"></p>
        <p id="alert-message" class="mt-0.5 text-xs sm:text-sm opacity-90"></p>
      </div>
    </div>

    <!-- Primary Microphone Control Stage -->
    <section class="px-6 pt-8 pb-6 sm:px-8 flex flex-col items-center justify-center">
      <div class="relative flex items-center justify-center">
        <!-- Pulsing outer rings (visible only while listening) -->
        <span
          id="mic-pulse-ring"
          class="hidden absolute inset-0 rounded-full bg-rose-500 animate-mic-ripple pointer-events-none"
        ></span>

        <!-- Prominent Microphone Button -->
        <button
          id="mic-btn"
          type="button"
          aria-label="Start listening"
          aria-pressed="false"
          class="relative z-10 flex items-center justify-center w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 hover:bg-indigo-700 active:scale-95 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-indigo-500/30 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-indigo-600"
        >
          <!-- Clean SVG Microphone Icon -->
          <svg
            id="mic-icon"
            class="w-9 h-9 sm:w-10 sm:h-10 transition-transform duration-200"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19 10v2a7 7 0 0 1-14 0v-2"
            />
            <line x1="12" y1="19" x2="12" y2="23" stroke-linecap="round" />
            <line x1="8" y1="23" x2="16" y2="23" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <!-- Live Status Indicator Pill -->
      <div class="mt-4 flex items-center gap-2.5 px-3.5 py-1.5 rounded-full bg-slate-100 border border-slate-200/70">
        <!-- Equalizer bars shown when listening -->
        <div id="eq-indicator" class="hidden items-end gap-0.5 h-3.5 w-3.5 justify-center">
          <span class="w-0.5 h-full bg-rose-500 rounded-full eq-bar-1"></span>
          <span class="w-0.5 h-full bg-rose-500 rounded-full eq-bar-2"></span>
          <span class="w-0.5 h-full bg-rose-500 rounded-full eq-bar-3"></span>
        </div>
        <!-- Static status dot when idle -->
        <span id="status-dot" class="w-2 h-2 rounded-full bg-slate-400"></span>
        <span id="status-text" class="text-xs sm:text-sm font-medium text-slate-600">
          Tap the microphone to start speaking
        </span>
      </div>
    </section>

    <!-- Transcription Output Area -->
    <section class="px-6 pb-6 sm:px-8">
      <div class="flex items-center justify-between mb-2">
        <label for="transcript-box" class="text-xs font-semibold uppercase tracking-wider text-slate-500">
          Transcribed Text
        </label>
        <div class="flex items-center gap-3">
          <span id="interim-badge" class="hidden text-xs font-medium text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">
            Listening…
          </span>
          <span id="word-count" class="text-xs text-slate-400 font-medium">
            0 words
          </span>
        </div>
      </div>

      <div class="relative">
        <textarea
          id="transcript-box"
          rows="6"
          placeholder="Your spoken words will appear here in real time. You can also type or edit the text directly…"
          class="w-full rounded-2xl border border-slate-200 bg-slate-50/70 p-4 text-base sm:text-lg leading-relaxed text-slate-800 placeholder:text-slate-400 shadow-inner transition focus:border-indigo-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500/20 resize-y"
        ></textarea>
      </div>

      <!-- Action Buttons Row: Stop, Reset, and Copy -->
      <div class="mt-4 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2.5">
          <!-- Stop Button -->
          <button
            id="stop-btn"
            type="button"
            disabled
            class="inline-flex items-center gap-2 rounded-xl bg-rose-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-rose-700 active:scale-95 focus:outline-none focus:ring-2 focus:ring-rose-500/30 disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none disabled:cursor-not-allowed disabled:active:scale-100"
          >
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
              <rect x="5" y="5" width="10" height="10" rx="1.5" />
            </svg>
            Stop
          </button>

          <!-- Reset Button -->
          <button
            id="reset-btn"
            type="button"
            disabled
            class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50 hover:border-slate-300 active:scale-95 focus:outline-none focus:ring-2 focus:ring-slate-400/20 disabled:bg-slate-50 disabled:text-slate-300 disabled:border-slate-100 disabled:shadow-none disabled:cursor-not-allowed disabled:active:scale-100"
          >
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Reset
          </button>
        </div>

        <!-- Copy Transcript Helper Button -->
        <button
          id="copy-btn"
          type="button"
          disabled
          class="inline-flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white px-3.5 py-2.5 text-sm font-medium text-slate-600 shadow-sm transition hover:bg-slate-50 hover:text-slate-900 active:scale-95 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 disabled:opacity-40 disabled:cursor-not-allowed disabled:active:scale-100"
        >
          <svg id="copy-icon" class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <span id="copy-label">Copy text</span>
        </button>
      </div>
    </section>

    <!-- Subtle Footer Tip -->
    <footer class="px-6 py-3.5 sm:px-8 bg-slate-50 border-t border-slate-100 text-xs text-slate-500 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-1">
      <span>Tip: Pause naturally between sentences—text accumulates until you click <strong>Reset</strong>.</span>
      <span class="text-slate-400">Works best in Chrome, Edge &amp; Safari</span>
    </footer>
  </main>

  <script>
    /**
     * Web Speech API Voice-to-Text Demo
     * Uses strictly the native browser SpeechRecognition / webkitSpeechRecognition interface.
     */
    (function () {
      // DOM References
      const micBtn = document.getElementById('mic-btn');
      const micPulseRing = document.getElementById('mic-pulse-ring');
      const stopBtn = document.getElementById('stop-btn');
      const resetBtn = document.getElementById('reset-btn');
      const copyBtn = document.getElementById('copy-btn');
      const copyLabel = document.getElementById('copy-label');
      const transcriptBox = document.getElementById('transcript-box');
      const languageSelect = document.getElementById('language-select');
      const statusText = document.getElementById('status-text');
      const statusDot = document.getElementById('status-dot');
      const eqIndicator = document.getElementById('eq-indicator');
      const interimBadge = document.getElementById('interim-badge');
      const wordCount = document.getElementById('word-count');
      const alertBanner = document.getElementById('alert-banner');
      const alertTitle = document.getElementById('alert-title');
      const alertMessage = document.getElementById('alert-message');

      // Check for native browser SpeechRecognition support
      const SpeechRecognitionAPI =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      // Application State
      let recognition = null;
      let isListening = false;
      let userRequestedStop = false;
      let finalizedText = ''; // Stores confirmed text accumulated across pauses/sessions
      let currentInterimText = ''; // Stores live in-progress words for the current utterance

      /**
       * Displays a styled alert message banner (used for unsupported browsers or permission issues).
       */
      function showAlert(type, title, message) {
        alertBanner.classList.remove(
          'hidden',
          'bg-rose-50',
          'border-rose-200',
          'text-rose-800',
          'bg-amber-50',
          'border-amber-200',
          'text-amber-800'
        );

        if (type === 'error') {
          alertBanner.classList.add('bg-rose-50', 'border-rose-200', 'text-rose-800');
        } else {
          alertBanner.classList.add('bg-amber-50', 'border-amber-200', 'text-amber-800');
        }

        alertTitle.textContent = title;
        alertMessage.textContent = message;
      }

      function hideAlert() {
        alertBanner.classList.add('hidden');
      }

      /**
       * Helper to join two text segments cleanly with a single space if needed.
       */
      function joinSegments(base, addition) {
        const cleanBase = base.trimEnd();
        const cleanAdd = addition.trimStart();
        if (!cleanBase) return cleanAdd;
        if (!cleanAdd) return cleanBase;
        // Avoid adding a space before standard punctuation marks
        if (/^[.,!?;:]/.test(cleanAdd)) {
          return cleanBase + cleanAdd;
        }
        return cleanBase + ' ' + cleanAdd;
      }

      /**
       * Updates the textarea value, word counter, and button enabled/disabled states.
       */
      function syncUI() {
        const combined = joinSegments(finalizedText, currentInterimText);
        transcriptBox.value = combined;

        // Auto-scroll textarea to the bottom while speaking
        if (isListening) {
          transcriptBox.scrollTop = transcriptBox.scrollHeight;
        }

        // Update word count
        const trimmed = combined.trim();
        const words = trimmed ? trimmed.split(/\s+/).length : 0;
        wordCount.textContent = `${words} ${words === 1 ? 'word' : 'words'}`;

        // Update button states
        stopBtn.disabled = !isListening;
        const hasContent = trimmed.length > 0;
        resetBtn.disabled = !hasContent && !isListening;
        copyBtn.disabled = !hasContent;

        // Update Microphone Button & Status Pill appearance
        if (isListening) {
          micBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700', 'shadow-indigo-600/30');
          micBtn.classList.add('bg-rose-600', 'hover:bg-rose-700', 'shadow-rose-600/30');
          micBtn.setAttribute('aria-pressed', 'true');
          micBtn.setAttribute('aria-label', 'Listening (tap to stop)');
          micPulseRing.classList.remove('hidden');

          statusDot.classList.add('hidden');
          eqIndicator.classList.remove('hidden');
          eqIndicator.classList.add('flex');
          statusText.textContent = 'Listening… speak now';
          statusText.classList.remove('text-slate-600');
          statusText.classList.add('text-rose-600', 'font-semibold');
        } else {
          micBtn.classList.remove('bg-rose-600', 'hover:bg-rose-700', 'shadow-rose-600/30');
          micBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'shadow-indigo-600/30');
          micBtn.setAttribute('aria-pressed', 'false');
          micBtn.setAttribute('aria-label', 'Start listening');
          micPulseRing.classList.add('hidden');

          eqIndicator.classList.add('hidden');
          eqIndicator.classList.remove('flex');
          statusDot.classList.remove('hidden');
          interimBadge.classList.add('hidden');
          statusText.textContent = hasContent
            ? 'Paused — tap microphone to continue'
            : 'Tap the microphone to start speaking';
          statusText.classList.remove('text-rose-600', 'font-semibold');
          statusText.classList.add('text-slate-600');
        }
      }

      /**
       * Initializes and configures the SpeechRecognition instance.
       */
      function initSpeechRecognition() {
        if (!SpeechRecognitionAPI) {
          micBtn.disabled = true;
          languageSelect.disabled = true;
          statusText.textContent = 'SpeechRecognition unavailable in this browser';
          showAlert(
            'error',
            'Browser Not Supported',
            'Your current browser does not support the Web Speech API (SpeechRecognition). Please open this page in Google Chrome, Microsoft Edge, or Apple Safari.'
          );
          return;
        }

        recognition = new SpeechRecognitionAPI();
        recognition.continuous = true; // Keep listening across natural pauses
        recognition.interimResults = true; // Stream real-time partial results as user speaks
        recognition.maxAlternatives = 1;

        // Apply initial language selection (falls back to browser/OS locale when empty)
        recognition.lang = languageSelect.value || navigator.language || 'en-US';

        recognition.onstart = () => {
          isListening = true;
          userRequestedStop = false;
          hideAlert();
          syncUI();
        };

        recognition.onresult = (event) => {
          let sessionFinal = '';
          let sessionInterim = '';

          // Iterate from resultIndex to process newly finalized and interim segments
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            const transcript = result[0].transcript;

            if (result.isFinal) {
              sessionFinal += transcript;
            } else {
              sessionInterim += transcript;
            }
          }

          if (sessionFinal) {
            finalizedText = joinSegments(finalizedText, sessionFinal);
          }

          currentInterimText = sessionInterim;

          if (sessionInterim.trim().length > 0) {
            interimBadge.classList.remove('hidden');
          } else {
            interimBadge.classList.add('hidden');
          }

          syncUI();
        };

        recognition.onerror = (event) => {
          switch (event.error) {
            case 'not-allowed':
            case 'service-not-allowed':
              userRequestedStop = true;
              isListening = false;
              showAlert(
                'error',
                'Microphone Access Blocked',
                'Please allow microphone permissions in your browser address bar settings and try again.'
              );
              break;

            case 'audio-capture':
              userRequestedStop = true;
              isListening = false;
              showAlert(
                'error',
                'No Microphone Found',
                'No working microphone was detected on your device. Check your audio input settings.'
              );
              break;

            case 'no-speech':
              // Benign timeout when user pauses silently; do not show an intrusive error
              statusText.textContent = 'No speech detected — still listening…';
              break;

            case 'network':
              userRequestedStop = true;
              isListening = false;
              showAlert(
                'error',
                'Speech Service Network Error',
                'The browser speech recognition service could not be reached. Check your internet connection.'
              );
              break;

            case 'aborted':
              // Triggered intentionally on stop/reset
              break;

            default:
              showAlert(
                'warning',
                'Speech Recognition Notice',
                `Recognition reported: ${event.error}`
              );
              break;
          }

          syncUI();
        };

        recognition.onend = () => {
          // Commit any lingering interim text when a session ends
          if (currentInterimText.trim()) {
            finalizedText = joinSegments(finalizedText, currentInterimText);
            currentInterimText = '';
          }

          // Some browsers (especially mobile Safari/Chrome) stop continuous recognition
          // after prolonged silence. Automatically restart unless the user clicked Stop/Reset.
          if (isListening && !userRequestedStop) {
            try {
              recognition.start();
              return;
            } catch (err) {
              // Fall through to clean stopped state if restart is disallowed
            }
          }

          isListening = false;
          syncUI();
        };
      }

      /**
       * Starts voice recognition.
       */
      function startListening() {
        if (!recognition || isListening) return;

        // Sync finalizedText with any manual edits the user typed into the textarea
        finalizedText = transcriptBox.value;
        currentInterimText = '';
        userRequestedStop = false;
        recognition.lang = languageSelect.value || navigator.language || 'en-US';

        try {
          recognition.start();
        } catch (err) {
          // Handle rare InvalidStateError if already starting
          console.warn('SpeechRecognition start warning:', err);
        }
      }

      /**
       * Stops active voice recognition while preserving existing text.
       */
      function stopListening() {
        if (!recognition || !isListening) return;
        userRequestedStop = true;
        isListening = false;
        try {
          recognition.stop();
        } catch (err) {
          console.warn('SpeechRecognition stop warning:', err);
        }
        syncUI();
      }

      /**
       * Stops listening (if active) and clears all transcribed text.
       */
      function resetAll() {
        userRequestedStop = true;
        if (recognition && isListening) {
          isListening = false;
          try {
            recognition.abort();
          } catch (err) {
            console.warn('SpeechRecognition abort warning:', err);
          }
        }

        finalizedText = '';
        currentInterimText = '';
        transcriptBox.value = '';
        hideAlert();
        syncUI();
      }

      // Event Listeners
      micBtn.addEventListener('click', () => {
        if (isListening) {
          stopListening();
        } else {
          startListening();
        }
      });

      stopBtn.addEventListener('click', stopListening);

      resetBtn.addEventListener('click', resetAll);

      // Keep internal finalizedText aligned if the user manually edits the textarea
      transcriptBox.addEventListener('input', () => {
        if (!isListening) {
          finalizedText = transcriptBox.value;
          syncUI();
        }
      });

      // If language changes while actively listening, restart seamlessly with the new language
      languageSelect.addEventListener('change', () => {
        if (!recognition) return;
        recognition.lang = languageSelect.value || navigator.language || 'en-US';
        if (isListening) {
          userRequestedStop = false;
          try {
            recognition.stop(); // onend will automatically restart with updated recognition.lang
          } catch (err) {
            console.warn('Language switch restart warning:', err);
          }
        }
      });

      // Copy button using execCommand fallback for seamless iframe compatibility
      copyBtn.addEventListener('click', () => {
        const textToCopy = transcriptBox.value;
        if (!textToCopy.trim()) return;

        transcriptBox.select();
        transcriptBox.setSelectionRange(0, textToCopy.length);

        try {
          document.execCommand('copy');
          const originalText = copyLabel.textContent;
          copyLabel.textContent = 'Copied!';
          setTimeout(() => {
            copyLabel.textContent = originalText;
          }, 1800);
        } catch (err) {
          console.warn('Copy failed:', err);
        }

        // Clear text selection highlight after copying
        window.getSelection()?.removeAllRanges();
      });

      // Boot application
      initSpeechRecognition();
      syncUI();
    })();
  </script>
</body>
</html>
